{% extends "layouts/teacher_base.html" %}

{% block title %}Teacher Dashboard{% endblock %}

{% block content %}


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static',path='css/suggesstion_style.css') }}">
</head>
<body>

    <div class="container">
    {% if flash_success %}
    <div class="alert alert-success" style="padding: 10px; background-color: #d4edda; color: #155724; border-radius: 4px; margin-bottom: 15px;">
        {{ flash_success }}
    </div>
    {% endif %}
    {% if flash_error %}
    <div class="alert alert-danger" style="padding: 10px; background-color: #f8d7da; color: #721c24; border-radius: 4px; margin-bottom: 15px;">
        {{ flash_error }}
    </div>
    {% endif %}
        <h1 class="headings">Complaint/Suggestion Form</h1>
        <form method="POST" action="/teacher_complaint" enctype="multipart/form-data">
           <input type="hidden" name="csrf_token" value="{{csrf_token(request)}}">
            <label for="title">Title:</label>
            <select id="title" name="title" required>
                <option value="" disabled selected>Select a title</option>
                <option value="Finance_Department">Finance Department</option>
                <option value="Exam_Department">Exam Department</option>
                <option value="Library">Library</option>
                <option value="Hostel">Hostel</option>
                <option value="Result">Result</option>
                <option value="Other">Other</option>
            </select>
            <br>
            <label for="message">Message:</label>
            <br>
            <textarea id="message" name="description" rows="6" required></textarea>
            <br>
            <button type="submit">Submit</button>
        </form>
    </div>

</body>
</html>
{% endblock %}

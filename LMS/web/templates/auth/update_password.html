<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static',path='css/global_style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static',path='css/students_module.css') }}">
    <link rel="icon" type="image/jpg" href="{{ url_for('static',path='images/logo.jpg') }}">
    <title>Update Password</title>
</head>
<body>
    <div class="standalone-header">Student Management System</div>

    <div class="container">
    <h1 class="headings">Update Password</h1>

    {% if error %}
    <p class="error-message" style="color:#b91c1c;background:#fee2e2;padding:10px;border-radius:6px;">{{ error }}</p>
    {% endif %}

    <form action="/update_password" method="POST">
        <label for="new_password">New Password:</label>
        <input type="password" id="new_password" name="new_password" required minlength="8">
        <br>
        <label for="confirm_password">Confirm Password:</label>
        <input type="password" id="confirm_password" name="confirm_password" required minlength="8">
        <br>
        <button type="submit" class="login-button">Update Password</button>
    </form>
</div>

    <div class="standalone-footer">&copy; 2023 Student Management System. All rights reserved.</div>
</body>
</html>

<div id="lms-chat" data-csrf="{{ csrf_token(request) }}">
  <button id="chat-toggle" type="button" aria-label="Chat">
    <i class="fa-solid fa-comments"></i>
  </button>
  <div id="chat-panel" hidden>
    <div class="chat-head"> AI Assistant <button id="chat-close" type="button">&times;</button></div>
    <div class="chat-body" id="chat-body">
      <div class="msg bot">Welcome! How can I help you today?</div>
    </div>
    <div class="chat-input">
      <input id="chat-text" type="text" maxlength="500" placeholder="Kindly ask...">
      <button id="chat-send" type="button"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>
</div>

<style>
#lms-chat{position:fixed;right:20px;bottom:20px;z-index:2000;font-family:inherit}
#chat-toggle{width:56px;height:56px;border-radius:50%;border:none;background:#0d6efd;color:#fff;font-size:22px;box-shadow:0 4px 12px rgba(0,0,0,.25);cursor:pointer}
#chat-panel{position:absolute;right:0;bottom:70px;width:340px;max-width:calc(100vw - 40px);height:440px;background:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
#chat-panel[hidden]{display:none}
.chat-head{background:#0d6efd;color:#fff;padding:10px 14px;font-weight:600;display:flex;justify-content:space-between}
.chat-head button{background:none;border:none;color:#fff;font-size:20px;cursor:pointer}
.chat-body{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;background:#f5f7fb}
.msg{max-width:85%;padding:8px 12px;border-radius:12px;font-size:14px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:#0d6efd;color:#fff}
.msg.bot{align-self:flex-start;background:#fff;color:#222;border:1px solid #e1e5ee}
.chat-input{display:flex;gap:6px;padding:8px;border-top:1px solid #e1e5ee}
.chat-input input{flex:1;border:1px solid #ccd;border-radius:8px;padding:8px}
.chat-input button{border:none;background:#0d6efd;color:#fff;border-radius:8px;padding:0 14px;cursor:pointer}
</style>

<script>
(function(){
  const root=document.getElementById('lms-chat');
  const csrf=root.dataset.csrf;
  const panel=document.getElementById('chat-panel');
  const body=document.getElementById('chat-body');
  const input=document.getElementById('chat-text');
  let history=[],busy=false;

  document.getElementById('chat-toggle').onclick=()=>{panel.hidden=!panel.hidden;if(!panel.hidden)input.focus();};
  document.getElementById('chat-close').onclick=()=>{panel.hidden=true;};

  function add(role,text){
    const d=document.createElement('div');
    d.className='msg '+role;
    d.textContent=text;            
    body.appendChild(d);
    body.scrollTop=body.scrollHeight;
    return d;
  }

  async function send(){
    const text=input.value.trim();
    if(!text||busy)return;
    busy=true;input.value='';
    add('user',text);
    const wait=add('bot','...');
    try{
      const r=await fetch('/chat',{
        method:'POST',
        headers:{'Content-Type':'application/json','X-CSRF-TOKEN':csrf},
        body:JSON.stringify({message:text,history:history.slice(-6)})
      });
      if(r.status===401||r.status===403){wait.textContent='Session refresh ho raha hai...';location.reload();return;}
      const data=await r.json().catch(()=>({}));
      if(!r.ok){wait.textContent=(typeof data.detail==='string'&&data.detail)||'Try again';return;}
      wait.textContent=data.reply;
      history.push({role:'user',content:text},{role:'assistant',content:data.reply});
    }catch(e){
      wait.textContent='Network Error';
    }finally{busy=false;}
  }

  document.getElementById('chat-send').onclick=send;
  input.addEventListener('keydown',e=>{if(e.key==='Enter')send();});
})();
</script>
